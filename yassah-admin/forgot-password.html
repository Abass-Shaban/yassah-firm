<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yassah Admin - Forgot Password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>Reset Password</h1>
        <p>Enter your email to reset your password</p>
      </div>
      <form id="forgot-password-form" class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email" />
        </div>
        <button type="submit" class="login-btn">Send Reset Link</button>
      </form>
      <div class="login-links">
        <a href="login.html" class="link">Back to Login</a>
      </div>
      <div id="forgot-error" class="error-message"></div>
      <div id="forgot-success" class="success-message"></div>
    </div>
  </div>

  <script>
    document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const errorDiv = document.getElementById('forgot-error');
      const successDiv = document.getElementById('forgot-success');

      // Clear previous messages
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      // Email validation
      if (!email || !email.includes('@')) {
        errorDiv.textContent = 'Please enter a valid email address';
        errorDiv.style.display = 'block';
        return;
      }

      // In production, this would send a reset email via backend API
      // For now, we'll simulate the process
      successDiv.textContent = 'Password reset link has been sent to your email. Please check your inbox.';
      successDiv.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 3000);
    });
  </script>
</body>
</html>

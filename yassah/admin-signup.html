<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yassah Admin Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="admin-login-container">
        <!-- Upper Div with Image -->
        <div class="admin-login-upper">
            <div class="admin-login-image">
                <img src="pics/yas4.webp" alt="Yassah Admin">
            </div>
        </div>

        <!-- Lower Div with Sign Up Form -->
        <div class="admin-login-lower">
            <div class="admin-login-form-container">
                <h2>Admin Sign Up</h2>
                <form id="adminSignupForm" onsubmit="handleAdminSignup(event)">
                    <div class="form-group">
                        <label for="adminName">Full Name</label>
                        <input type="text" id="adminName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="adminEmail">Email</label>
                        <input type="email" id="adminEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Password</label>
                        <input type="password" id="adminPassword" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="adminConfirmPassword">Confirm Password</label>
                        <input type="password" id="adminConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>
                <p class="login-footer">Already have an account? <a href="index.html" style="color: #EBB93B;">Login</a></p>
                <p class="login-footer">© 2026 Yassah Accounting Firm</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
